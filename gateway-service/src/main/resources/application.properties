spring.application.name=gateway-service
server.port=${GATEWAY_PORT:8080}

# Force reactive web (WebFlux) even though JPA is on the classpath
spring.main.web-application-type=reactive

# PostgreSQL — for TeamConfig rate limit settings
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gatewaydb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis — for sliding window rate limit counters
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT — must match auth-service secret
jwt.secret=${JWT_SECRET:changeme-replace-in-production}

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Routes — forward to internal Docker network hostnames
# /auth/** → auth-service:8081
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# /agent/** → agent-service:8082
spring.cloud.gateway.routes[1].id=agent-service
spring.cloud.gateway.routes[1].uri=http://agent-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/agent/**

# /audit/** → audit-service:8083
spring.cloud.gateway.routes[2].id=audit-service
spring.cloud.gateway.routes[2].uri=http://audit-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/audit/**

# /analytics/** → analytics-service:8084
spring.cloud.gateway.routes[3].id=analytics-service
spring.cloud.gateway.routes[3].uri=http://analytics-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/analytics/**

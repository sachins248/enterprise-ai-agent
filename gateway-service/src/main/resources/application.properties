# The name of this service
spring.application.name=gateway-service
# The port to listen on (uses GATEWAY_PORT if set, otherwise 8080)
server.port=${GATEWAY_PORT:8080}

# Force reactive web (WebFlux) even though JPA is on the classpath
# (the gateway only works in reactive mode)
spring.main.web-application-type=reactive

# PostgreSQL — for TeamConfig rate limit settings
# Where the database is (each part can be changed with an environment variable)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gatewaydb}
# The database user name
spring.datasource.username=${POSTGRES_USER:postgres}
# The database password
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
# The Java driver used to talk to PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
# Create or update tables automatically so we don't write SQL by hand
spring.jpa.hibernate.ddl-auto=update
# Tell Hibernate we are using PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis — for sliding window rate limit counters
# The Redis server name
spring.data.redis.host=${REDIS_HOST:redis}
# The Redis port
spring.data.redis.port=${REDIS_PORT:6379}
# The Redis password (empty means no password)
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT — must match auth-service secret
# If the secrets differ, the gateway will reject every token
jwt.secret=${JWT_SECRET:changeme-replace-in-production}

# Actuator health endpoint
# Only show the health and info pages
management.endpoints.web.exposure.include=health,info
# Show full details on the health page
management.endpoint.health.show-details=always

# Routes — forward to internal Docker network hostnames
# /auth/** → auth-service:8081
# A name for this route
spring.cloud.gateway.routes[0].id=auth-service
# Where to send matching requests
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
# Match any URL that starts with /auth/
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# /agent/** → agent-service:8082
# A name for this route
spring.cloud.gateway.routes[1].id=agent-service
# Where to send matching requests
spring.cloud.gateway.routes[1].uri=http://agent-service:8082
# Match any URL that starts with /agent/
spring.cloud.gateway.routes[1].predicates[0]=Path=/agent/**

# /audit/** → audit-service:8083
# A name for this route
spring.cloud.gateway.routes[2].id=audit-service
# Where to send matching requests
spring.cloud.gateway.routes[2].uri=http://audit-service:8083
# Match any URL that starts with /audit/
spring.cloud.gateway.routes[2].predicates[0]=Path=/audit/**

# /analytics/** → analytics-service:8084
# A name for this route
spring.cloud.gateway.routes[3].id=analytics-service
# Where to send matching requests
spring.cloud.gateway.routes[3].uri=http://analytics-service:8084
# Match any URL that starts with /analytics/
spring.cloud.gateway.routes[3].predicates[0]=Path=/analytics/**

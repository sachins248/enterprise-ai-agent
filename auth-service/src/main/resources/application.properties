# The name of this service
spring.application.name=auth-service
# The port to listen on (uses AUTH_PORT if set, otherwise 8081)
server.port=${AUTH_PORT:8081}

# PostgreSQL — connects to 'postgres' container on Docker network
# Where the database is (each part can be changed with an environment variable)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:authdb}
# The database user name
spring.datasource.username=${POSTGRES_USER:postgres}
# The database password
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
# The Java driver used to talk to PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — auto-create/update tables from entity classes
# Create or update tables automatically so we don't write SQL by hand
spring.jpa.hibernate.ddl-auto=update
# Don't print every SQL command (it is too noisy)
spring.jpa.show-sql=false
# Tell Hibernate we are using PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT settings
# The secret used to sign tokens (MUST be changed in production)
jwt.secret=${JWT_SECRET:changeme-replace-in-production}
# Access tokens last 900000 ms (15 minutes) so a stolen one stops working soon
jwt.access-token.expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
# Refresh tokens last 604800000 ms (7 days) so users don't log in all the time
jwt.refresh-token.expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Actuator
# Only show the health and info pages
management.endpoints.web.exposure.include=health,info
# Show full details on the health page
management.endpoint.health.show-details=always

# The name of this service
spring.application.name=audit-service
# The port to listen on (uses AUDIT_PORT if set, otherwise 8083)
server.port=${AUDIT_PORT:8083}

# PostgreSQL
# Where the database is (each part can be changed with an environment variable)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:auditdb}
# The database user name
spring.datasource.username=${POSTGRES_USER:postgres}
# The database password
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
# The Java driver used to talk to PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# Create or update tables automatically so we don't write SQL by hand
spring.jpa.hibernate.ddl-auto=update
# Don't print every SQL command (it is too noisy)
spring.jpa.show-sql=false
# Tell Hibernate we are using PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka consumer — manual ack so we only commit after DB write succeeds
# Where Kafka is
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
# The consumer group name (Kafka remembers which messages this group already read)
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_AUDIT:audit-group}
# If the group is new, start reading from the very first message
spring.kafka.consumer.auto-offset-reset=earliest
# Read the message key as text
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Read the message value as text
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# We confirm each message ourselves, after saving it to the database
spring.kafka.listener.ack-mode=manual

# JWT — must match auth-service secret to validate tokens
# If the secrets differ, every token will be rejected
jwt.secret=${JWT_SECRET:changeme-replace-in-production}

# Actuator
# Only show the health and info pages
management.endpoints.web.exposure.include=health,info
# Show full details on the health page
management.endpoint.health.show-details=always

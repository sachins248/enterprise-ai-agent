<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent — Enterprise AI Coding Platform</title>
    <meta name="description" content="Enterprise AI coding agent with real-time streaming chat, session history, GitHub pipeline analysis, and team analytics." />
    <script>
      // Set the theme before anything paints, so there's no flash of the
      // wrong theme on load. Mirrors the logic in ThemeContext.jsx.
      (function () {
        try {
          var stored = localStorage.getItem('agent-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

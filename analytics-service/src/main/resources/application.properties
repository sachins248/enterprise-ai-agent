# The name of this service
spring.application.name=analytics-service
# The port to listen on (uses ANALYTICS_PORT if set, otherwise 8084)
server.port=${ANALYTICS_PORT:8084}

# PostgreSQL
# Where the database is (each part can be changed with an environment variable)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:analyticsdb}
# The database user name
spring.datasource.username=${POSTGRES_USER:postgres}
# The database password
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
# The Java driver used to talk to PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# Create or update tables automatically so we don't write SQL by hand
spring.jpa.hibernate.ddl-auto=update
# Don't print every SQL command (it is too noisy)
spring.jpa.show-sql=false
# Tell Hibernate we are using PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — must match the secret used by auth-service to sign tokens
# If the secrets differ, every token will be rejected
jwt.secret=${JWT_SECRET:changeme-replace-in-production}

# Kafka consumer
# Where Kafka is
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
# The consumer group name (a different group from audit, so both services get every message)
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ANALYTICS:analytics-group}
# If the group is new, start reading from the very first message
spring.kafka.consumer.auto-offset-reset=earliest
# Read the message key as text
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Read the message value as text
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Manual ack — analytics consumer only commits offset after successful DB write
# We confirm each message ourselves, after saving it to the database
spring.kafka.listener.ack-mode=manual

# Redis for caching aggregated results
# The Redis server name
spring.data.redis.host=${REDIS_HOST:redis}
# The Redis port
spring.data.redis.port=${REDIS_PORT:6379}
# The Redis password (empty means no password)
spring.data.redis.password=${REDIS_PASSWORD:}

# Actuator
# Only show the health and info pages
management.endpoints.web.exposure.include=health,info
# Show full details on the health page
management.endpoint.health.show-details=always

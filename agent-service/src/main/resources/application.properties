# The name of this service
spring.application.name=agent-service
# The port to listen on (uses AGENT_PORT if set, otherwise 8082)
server.port=${AGENT_PORT:8082}

# PostgreSQL
# Where the database is (each part can be changed with an environment variable)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:agentdb}
# The database user name
spring.datasource.username=${POSTGRES_USER:postgres}
# The database password
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
# The Java driver used to talk to PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# Create or update tables automatically so we don't write SQL by hand
spring.jpa.hibernate.ddl-auto=update
# Don't print every SQL command (it is too noisy)
spring.jpa.show-sql=false
# Tell Hibernate we are using PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka producer settings
# Where Kafka is
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
# Turn the message key into text before sending
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Turn the message value into text before sending
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Wait until Kafka confirms every copy of the message is saved (safest option)
spring.kafka.producer.acks=all
# Try again up to 3 times if sending fails
spring.kafka.producer.retries=3

# JWT — must match the secret used by auth-service to sign tokens
# If the secrets differ, every token will be rejected
jwt.secret=${JWT_SECRET:changeme-replace-in-production}

# GitHub webhook secret — set to verify X-Hub-Signature-256; leave blank to skip verification
# Empty means we don't check the signature (fine for local testing only)
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}

# Gemini API
# The secret key for Gemini (empty by default, so you must set it)
gemini.api.key=${GEMINI_API_KEY:}
# The web address of the Gemini API
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
# Which Gemini model to use
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash-lite}

# Actuator
# Only show the health and info pages
management.endpoints.web.exposure.include=health,info
# Show full details on the health page
management.endpoint.health.show-details=always
